<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- フレーム -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#0f172a" stroke-width="8"/>
  <circle cx="50" cy="50" r="38" fill="#1e2937" stroke="#64748b" stroke-width="4"/>
  
  <!-- 分身1（左） -->
  <!-- 頭 -->
  <ellipse cx="35" cy="44" rx="9" ry="10" fill="#e2e8f0"/>
  <!-- 頭帯 -->
  <rect x="28" y="36" width="14" height="6" rx="1" fill="#ef4444"/>
  <!-- 体 -->
  <rect x="29" y="54" width="12" height="19" rx="3" fill="#e2e8f0"/>
  <!-- 脚 -->
  <line x1="34" y1="73" x2="29" y2="81" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <line x1="37" y1="73" x2="42" y2="81" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>

  <!-- 分身2（右・少し透け感で影分身） -->
  <!-- 頭 -->
  <ellipse cx="67" cy="45" rx="9" ry="10" fill="#e2e8f0" opacity="0.75"/>
  <!-- 頭帯 -->
  <rect x="60" y="37" width="14" height="6" rx="1" fill="#ef4444" opacity="0.75"/>
  <!-- 体 -->
  <rect x="61" y="55" width="12" height="19" rx="3" fill="#e2e8f0" opacity="0.75"/>
  <!-- 脚 -->
  <line x1="66" y1="74" x2="61" y2="82" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <line x1="69" y1="74" x2="74" y2="82" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
</svg>
